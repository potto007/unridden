# Optional local deployment. Remove this drop-in to restore the original TCP
# listener. It changes transport only; the existing unit remains the authority.
[Unit]
Description=Unridden private snapshot model service (Unix socket, split18-30 profile)

[Service]
RuntimeDirectory=unridden-backend
RuntimeDirectoryMode=0700
UMask=0077
ExecStart=
ExecStart=%h/src/ottomation/unridden/.venv/bin/python -m unridden.api.cli serve --gpu --snapshots --no-v1 --uds %t/unridden-backend/api.sock
